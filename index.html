<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gloura</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    color: #fff;
    text-align: center;
    padding: 32px;
  }
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    background: linear-gradient(135deg, #f4a582, #d9534f);
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #999; font-size: 15px; margin: 0 0 28px; }
  a.btn {
    display: inline-block;
    padding: 15px 40px;
    background: #fff;
    color: #000;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
  }
</style>
</head>
<body>
  <div class="icon"></div>
  <h1>Gloura'yı Aç</h1>
  <p>AI Skincare Coach</p>
  <a class="btn" id="openBtn" href="itms-apps://apps.apple.com/tr/app/gloura/id6760882839">
    App Store'da Aç
  </a>

  <script>
    var appStoreUrl = "https://apps.apple.com/tr/app/gloura/id6760882839";
    var itmsUrl = "itms-apps://apps.apple.com/tr/app/gloura/id6760882839";

    // Otomatik dene (bazı tarayıcılarda çalışır)
    window.location.href = itmsUrl;

    // Yakalanamazsa 1.2sn sonra normal App Store web sayfasına düş
    // (kullanıcı butona basarsa zaten itms-apps tetiklenir)
    setTimeout(function () {
      // Sayfa hâlâ görünüyorsa (yönlendirme olmadıysa) buton zaten orada duruyor
    }, 1200);
  </script>
</body>
</html>
