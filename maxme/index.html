<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxMe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    color: #fff;
    text-align: center;
    padding: 32px;
  }
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    object-fit: cover;
    margin-bottom: 24px;
    overflow: hidden;
    display: block;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: #999; font-size: 15px; margin: 0 0 28px; }
  a.btn {
    display: inline-block;
    padding: 15px 40px;
    background: #fff;
    color: #000;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
  }
  .instructions {
    display: none;
    margin-top: 28px;
    max-width: 300px;
    background: #1c1c1e;
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 14px;
    color: #ddd;
    line-height: 1.5;
    text-align: left;
  }
  .instructions.show { display: block; }
  .instructions b { color: #fff; }
  .steps { margin: 10px 0 0; padding-left: 18px; }
  .steps li { margin-bottom: 6px; }
</style>
</head>
